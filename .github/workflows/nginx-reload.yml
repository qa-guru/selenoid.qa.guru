name: nginx-reload

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref with nginx scripts (branch or tag)'
        required: false
        default: main

jobs:
  nginx:
    runs-on: ubuntu-latest
    environment: selenoid-production
    env:
      SELENOID_PUBLIC_USER: ${{ vars.SELENOID_PUBLIC_USER }}
      SELENOID_PUBLIC_PASSWORD: ${{ secrets.SELENOID_PUBLIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Require production auth configuration
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${SELENOID_PUBLIC_USER:-}" ]] && missing+=(SELENOID_PUBLIC_USER)
          [[ -z "${SELENOID_PUBLIC_PASSWORD:-}" ]] && missing+=(SELENOID_PUBLIC_PASSWORD)
          if ((${#missing[@]})); then
            echo "::error::Missing selenoid-production config: ${missing[*]}"
            exit 1
          fi

      - name: Upload nginx scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SELENOID_DEPLOY_HOST }}
          username: ${{ secrets.SELENOID_DEPLOY_USER }}
          key: ${{ secrets.SELENOID_DEPLOY_KEY }}
          source: "deploy/nginx-selenoid.conf,deploy/sync-nginx.sh,deploy/lib/require-public-auth.sh"
          target: ".selenoid-nginx-reload"
          strip_components: 1
          overwrite: true

      - uses: appleboy/ssh-action@v1.2.5
        env:
          SELENOID_PUBLIC_USER: ${{ vars.SELENOID_PUBLIC_USER }}
          SELENOID_PUBLIC_PASSWORD: ${{ secrets.SELENOID_PUBLIC_PASSWORD }}
          SELENOID_CI_USER: ${{ vars.SELENOID_CI_USER }}
          SELENOID_CI_PASSWORD: ${{ secrets.SELENOID_CI_PASSWORD }}
        with:
          host: ${{ secrets.SELENOID_DEPLOY_HOST }}
          username: ${{ secrets.SELENOID_DEPLOY_USER }}
          key: ${{ secrets.SELENOID_DEPLOY_KEY }}
          envs: SELENOID_PUBLIC_USER,SELENOID_PUBLIC_PASSWORD,SELENOID_CI_USER,SELENOID_CI_PASSWORD
          script: |
            set -euxo pipefail
            if [[ -z "${SELENOID_PUBLIC_USER:-}" || -z "${SELENOID_PUBLIC_PASSWORD:-}" ]]; then
              echo "SELENOID_PUBLIC_USER and SELENOID_PUBLIC_PASSWORD must be set for nginx sync" >&2
              exit 1
            fi
            STAGING="$HOME/.selenoid-nginx-reload"
            install -m 644 "$STAGING/nginx-selenoid.conf" /tmp/nginx-selenoid.conf
            install -m 755 "$STAGING/sync-nginx.sh" /tmp/sync-nginx.sh
            install -d /tmp/lib
            install -m 644 "$STAGING/lib/require-public-auth.sh" /tmp/lib/require-public-auth.sh
            sudo -n \
              NGINX_CONF_SRC=/tmp/nginx-selenoid.conf \
              SELENOID_PUBLIC_USER="${SELENOID_PUBLIC_USER}" \
              SELENOID_PUBLIC_PASSWORD="${SELENOID_PUBLIC_PASSWORD}" \
              SELENOID_CI_USER="${SELENOID_CI_USER:-}" \
              SELENOID_CI_PASSWORD="${SELENOID_CI_PASSWORD:-}" \
              /tmp/sync-nginx.sh

            SERVERNAME="${{ vars.SELENOID_PUBLIC_HOST }}"
            SERVERNAME="${SERVERNAME:-selenoid.qa.guru}"
            BASE_URL="https://${SERVERNAME}"
            AUTH="${SELENOID_PUBLIC_USER}:${SELENOID_PUBLIC_PASSWORD}"

            curl -fsSL --http1.1 "${BASE_URL}/status" >/dev/null
            logs_code="$(curl -sS --http1.1 -o /dev/null -w '%{http_code}' -u "${AUTH}" "${BASE_URL}/logs/unknown-session")"
            if [[ "$logs_code" != "400" ]]; then
              echo "FAIL: ${BASE_URL}/logs/unknown-session want HTTP 400, got ${logs_code}" >&2
              exit 1
            fi
            logs_no_auth="$(curl -sS --http1.1 -o /dev/null -w '%{http_code}' "${BASE_URL}/logs/unknown-session")"
            if [[ "$logs_no_auth" != "401" ]]; then
              echo "FAIL: ${BASE_URL}/logs/unknown-session without auth want HTTP 401, got ${logs_no_auth}" >&2
              exit 1
            fi
            wd_headers="$(curl -sSI --http1.1 "${BASE_URL}/wd/hub/status")"
            if ! grep -qiE '^HTTP/1\.[01] 401' <<<"$wd_headers"; then
              echo "FAIL: ${BASE_URL}/wd/hub/status without auth want HTTP 401" >&2
              echo "$wd_headers" >&2
              exit 1
            fi
            if grep -qiE '^www-authenticate:' <<<"$wd_headers"; then
              echo "FAIL: ${BASE_URL}/wd/hub/status leaked WWW-Authenticate (native dialog)" >&2
              echo "$wd_headers" >&2
              exit 1
            fi
            error_code="$(curl -sS --http1.1 -o /dev/null -w '%{http_code}' -u "${AUTH}" "${BASE_URL}/error")"
            if [[ "$error_code" != "404" ]]; then
              echo "FAIL: ${BASE_URL}/error with auth want HTTP 404, got ${error_code}" >&2
              exit 1
            fi
            vnc_code="$(curl -sS --http1.1 -o /dev/null -w '%{http_code}' -u "${AUTH}" "${BASE_URL}/vnc/unknown-session")"
            if [[ "$vnc_code" != "400" ]]; then
              echo "FAIL: ${BASE_URL}/vnc/unknown-session with auth want HTTP 400, got ${vnc_code}" >&2
              exit 1
            fi
            echo "OK: nginx reload smoke passed (/status, /logs/, /wd/hub, /error, /vnc/)"
