name: deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Hub stack release tag (e.g. v3.0.4). Empty = default in deploy.sh'
        required: false
        default: ''
      ui_version:
        description: 'selenoid-ui release tag (e.g. v3.0.24). Empty = v3.0.24 pin'
        required: false
        default: ''
      ref:
        description: 'Git ref with deploy scripts (branch or tag)'
        required: false
        default: main
      pull_browsers:
        description: 'never | auto | always — browser docker pull on Box1'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - never
          - always
      skip_inline_browser_smoke:
        description: 'Skip 4× WebDriver session smoke in deploy.sh (Go smoke follows in deploy-smoke job)'
        required: false
        default: true
        type: boolean
  repository_dispatch:
    types: [deploy-selenoid]

concurrency:
  group: selenoid-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: selenoid-production
    outputs:
      hub_version: ${{ steps.meta.outputs.hub_version }}
      ui_version: ${{ steps.meta.outputs.ui_version }}
      smoke_source_version: ${{ steps.meta.outputs.smoke_source_version }}
    env:
      SELENOID_PUBLIC_USER: ${{ vars.SELENOID_PUBLIC_USER }}
      SELENOID_PUBLIC_PASSWORD: ${{ secrets.SELENOID_PUBLIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.client_payload.ref || 'main' }}

      - name: Require production auth configuration
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${SELENOID_PUBLIC_USER:-}" ]] && missing+=(SELENOID_PUBLIC_USER)
          [[ -z "${SELENOID_PUBLIC_PASSWORD:-}" ]] && missing+=(SELENOID_PUBLIC_PASSWORD)
          if ((${#missing[@]})); then
            echo "::error::Missing selenoid-production config: ${missing[*]}"
            exit 1
          fi

      - name: Resolve stack version and script ref
        id: meta
        run: |
          set -euo pipefail
          hub=""
          ui=""
          ref="main"
          pull_browsers="auto"
          skip_inline="true"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            hub="${{ inputs.version }}"
            ui="${{ inputs.ui_version }}"
            ui="${ui:-v3.0.24}"
            ref="${{ inputs.ref }}"
            pull_browsers="${{ inputs.pull_browsers }}"
            skip_inline="${{ inputs.skip_inline_browser_smoke }}"
          elif [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            hub="${{ github.event.client_payload.version }}"
            ui="${{ github.event.client_payload.ui_version }}"
            ui="${ui:-v3.0.24}"
            ref="${{ github.event.client_payload.ref || 'main' }}"
            pull_browsers="${{ github.event.client_payload.pull_browsers || 'never' }}"
            skip_inline="${{ github.event.client_payload.skip_inline_browser_smoke }}"
            if [[ -z "${skip_inline}" || "${skip_inline}" == "null" ]]; then
              skip_inline="true"
            fi
          else
            ui="v3.0.24"
          fi
          smoke_source="${hub:-${ui}}"
          if [[ -z "${smoke_source}" ]]; then
            smoke_source="v3.0.8"
          fi
          {
            echo "hub_version=${hub}"
            echo "ui_version=${ui}"
            echo "ref=${ref}"
            echo "pull_browsers=${pull_browsers}"
            echo "skip_inline=${skip_inline}"
            echo "smoke_source_version=${smoke_source}"
          } >> "$GITHUB_OUTPUT"

      # Deploy user stays selenoid@ (canon ops user qaguru is for interactive SSH only).
      # Copy from checkout — do not curl raw.githubusercontent.com (CDN can serve stale deploy.sh).
      - name: Upload deploy scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SELENOID_DEPLOY_HOST }}
          username: ${{ secrets.SELENOID_DEPLOY_USER }}
          key: ${{ secrets.SELENOID_DEPLOY_KEY }}
          source: "deploy/deploy.sh,deploy/sync-nginx.sh,deploy/lib/require-public-auth.sh,deploy/nginx-selenoid.conf,deploy/browsers-production.json,deploy/selenoid-hub.service,deploy/cleanup-videos.sh,deploy/video-retention.sh"
          target: ".selenoid-deploy"
          strip_components: 1
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          SELENOID_PUBLIC_USER: ${{ vars.SELENOID_PUBLIC_USER }}
          SELENOID_PUBLIC_PASSWORD: ${{ secrets.SELENOID_PUBLIC_PASSWORD }}
          SELENOID_CI_USER: ${{ vars.SELENOID_CI_USER }}
          SELENOID_CI_PASSWORD: ${{ secrets.SELENOID_CI_PASSWORD }}
        with:
          host: ${{ secrets.SELENOID_DEPLOY_HOST }}
          username: ${{ secrets.SELENOID_DEPLOY_USER }}
          key: ${{ secrets.SELENOID_DEPLOY_KEY }}
          envs: SELENOID_PUBLIC_USER,SELENOID_PUBLIC_PASSWORD,SELENOID_CI_USER,SELENOID_CI_PASSWORD
          command_timeout: 20m
          script: |
            set -euo pipefail
            if [[ -z "${SELENOID_PUBLIC_USER:-}" || -z "${SELENOID_PUBLIC_PASSWORD:-}" ]]; then
              echo "SELENOID_PUBLIC_USER and SELENOID_PUBLIC_PASSWORD must be set for nginx sync" >&2
              exit 1
            fi
            export SELENOID_PUBLIC_USER SELENOID_PUBLIC_PASSWORD
            # Optional per-consumer CI account; a host without it keeps the two base users.
            export SELENOID_CI_USER="${SELENOID_CI_USER:-}"
            export SELENOID_CI_PASSWORD="${SELENOID_CI_PASSWORD:-}"
            TAG="${{ steps.meta.outputs.hub_version }}"
            if [[ -n "$TAG" ]]; then
              export SELENOID_VERSION="$TAG"
            fi
            export SELENOID_UI_VERSION="${{ steps.meta.outputs.ui_version }}"
            export PULL_BROWSERS="${{ steps.meta.outputs.pull_browsers }}"
            export SKIP_INLINE_BROWSER_SMOKE="${{ steps.meta.outputs.skip_inline }}"
            export CM_VERSION="${CM_VERSION:-v3.0.2}"
            export VIDEO_RECORDER_IMAGE="${VIDEO_RECORDER_IMAGE:-qaguru/video-recorder:latest}"
            export SELENOID_CONFIG_DIR="${{ vars.SELENOID_CONFIG_DIR }}"
            export SELENOID_CONFIG_DIR="${SELENOID_CONFIG_DIR:-/opt/selenoid}"
            export CM_BIN="$HOME/cm"
            STAGING="$HOME/.selenoid-deploy"
            test -x "$STAGING/deploy.sh"
            chmod +x "$STAGING/deploy.sh" "$STAGING/sync-nginx.sh" "$STAGING/cleanup-videos.sh" "$STAGING/video-retention.sh"
            install -m 644 "$STAGING/nginx-selenoid.conf" /tmp/nginx-selenoid.conf
            install -m 755 "$STAGING/sync-nginx.sh" /tmp/sync-nginx.sh
            install -d /tmp/lib
            install -m 644 "$STAGING/lib/require-public-auth.sh" /tmp/lib/require-public-auth.sh
            install -m 644 "$STAGING/selenoid-hub.service" /tmp/selenoid-hub.service
            install -d "${SELENOID_CONFIG_DIR}/lib" 2>/dev/null || true
            install -m 644 "$STAGING/lib/require-public-auth.sh" "${SELENOID_CONFIG_DIR}/lib/require-public-auth.sh" 2>/dev/null || true
            install -m 755 "$STAGING/sync-nginx.sh" "${SELENOID_CONFIG_DIR}/bin/sync-nginx.sh" 2>/dev/null || true
            export NGINX_CONF_SRC=/tmp/nginx-selenoid.conf
            export NGINX_SYNC_SCRIPT=/tmp/sync-nginx.sh
            export BROWSERS_PRODUCTION="$STAGING/browsers-production.json"
            export HUB_UNIT_SRC=/tmp/selenoid-hub.service
            export CM_VERSION=v3.0.2
            export GIT_REVISION="${GIT_REVISION:-v3.0.8}"
            export SELENOID_WARM_POOL_URL="${SELENOID_WARM_POOL_URL:-http://127.0.0.1:9090}"
            echo "Deploy pins: SELENOID_VERSION=${SELENOID_VERSION:-default} SELENOID_UI_VERSION=${SELENOID_UI_VERSION} PULL_BROWSERS=${PULL_BROWSERS} SKIP_INLINE_BROWSER_SMOKE=${SKIP_INLINE_BROWSER_SMOKE}"
            grep -q download_binary "$STAGING/deploy.sh"
            grep -q -- '-warm-pool-url' "$STAGING/selenoid-hub.service"
            bash "$STAGING/deploy.sh"

      - name: Smoke test (public)
        env:
          SELENOID_PUBLIC_USER: ${{ vars.SELENOID_PUBLIC_USER }}
          SELENOID_PUBLIC_PASSWORD: ${{ secrets.SELENOID_PUBLIC_PASSWORD }}
          SELENOID_PUBLIC_URL: ${{ vars.SELENOID_PUBLIC_URL }}
          SELENOID_VERSION: ${{ steps.meta.outputs.hub_version || 'v3.0.8' }}
          SELENOID_UI_VERSION: ${{ steps.meta.outputs.ui_version }}
          EXPECT_WARM_METRICS: '1'
          EXPECTED_WARM_TOTAL: '2'
        run: |
          if [[ -z "${SELENOID_PUBLIC_URL:-}" ]]; then
            echo "SELENOID_PUBLIC_URL is not set — skip public smoke test" >&2
            exit 0
          fi
          if [[ -z "${SELENOID_PUBLIC_USER:-}" || -z "${SELENOID_PUBLIC_PASSWORD:-}" ]]; then
            echo "::error::SELENOID_PUBLIC_USER and SELENOID_PUBLIC_PASSWORD required for smoke test"
            exit 1
          fi
          chmod +x deploy/smoke-remote.sh
          ./deploy/smoke-remote.sh "$SELENOID_PUBLIC_URL"

  # Sole owner of post-deploy prod Go smoke (release repos use wait_only pin gate).
  deploy-smoke:
    name: Deploy smoke → selenoid-tests
    needs: deploy
    if: success()
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/smoke-trigger-callback.yml
    secrets:
      SELENOID_TESTS_DISPATCH_TOKEN: ${{ secrets.SELENOID_TESTS_DISPATCH_TOKEN }}
    with:
      test_tags: api,smoke
      env_profile: selenoid_qa_guru_api
      source_version: ${{ needs.deploy.outputs.smoke_source_version }}
      source_ref: main
      summary_title: Deploy smoke → selenoid-tests (owner · Go hub-prod)
      callback_timeout_minutes: 35
