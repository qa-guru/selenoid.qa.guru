# nginx для selenoid.qa.guru (RU greenfield)
# Grey cloud DNS — TLS on origin via certbot.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream selenoid_hub {
    server 127.0.0.1:4444;
}

upstream selenoid_ui {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name selenoid.qa.guru;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name selenoid.qa.guru;

    ssl_certificate /etc/letsencrypt/live/selenoid.qa.guru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/selenoid.qa.guru/privkey.pem;

    location = /status {
        auth_basic off;
        proxy_pass http://selenoid_ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /hub/status {
        auth_basic off;
        proxy_pass http://selenoid_hub/status;
        proxy_set_header Host $host;
    }

    location ^~ /wd/hub {
        auth_basic "Selenoid";
        auth_basic_user_file /etc/nginx/selenoid.htpasswd;
        proxy_pass http://selenoid_ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        auth_basic off;
        proxy_pass http://selenoid_ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
