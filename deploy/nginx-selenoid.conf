# nginx для selenoid.qa.guru
# Скопировать в /etc/nginx/sites-available/selenoid и включить site.
#
# htpasswd — две связки (students + public guest); sync-nginx.sh создаёт обе из env:
#   SELENOID_STUDENT_USER / SELENOID_STUDENT_PASSWORD (default user1 / 1234)
#   SELENOID_PUBLIC_USER / SELENOID_PUBLIC_PASSWORD (required, no defaults)
# Playwright map keys __SELENOID_PUBLIC_ACCESS_KEY__* подставляет sync-nginx.sh.
#
# Проверка и reload:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Схема: UI (/) без auth; htpasswd на /wd/hub, /logs/, /vnc/, /error — через
# auth_request (НЕ auth_basic): auth_basic всегда шлёт WWW-Authenticate: Basic,
# и Chrome рисует нативную модалку поверх UI. WebDriver сам шлёт Authorization.
# /playwright/ — accessKey в query (браузерный WS не умеет credentials).
# UI guest creds — build-time hubAuth, не runtime flag. Для CI с Authorization — порт 4445.
# Все UI-пути — через selenoid-ui (8080) → hub (4444); /logs/ и /hub/status — напрямую на hub.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $arg_accessKey $playwright_access_key_ok {
    default 0;
    "user1:1234" 1;
    "user1%3A1234" 1;
    "__SELENOID_PUBLIC_ACCESS_KEY__" 1;
    "__SELENOID_PUBLIC_ACCESS_KEY_URLENC__" 1;
}

map $arg_access_key $playwright_access_key_alias_ok {
    default 0;
    "user1:1234" 1;
    "user1%3A1234" 1;
    "__SELENOID_PUBLIC_ACCESS_KEY__" 1;
    "__SELENOID_PUBLIC_ACCESS_KEY_URLENC__" 1;
}

map "$playwright_access_key_ok$playwright_access_key_alias_ok" $playwright_access_key_allowed {
    default 0;
    ~1 1;
}

upstream selenoid_hub {
    server 127.0.0.1:4444;
}

upstream selenoid_ui {
    server 127.0.0.1:8080;
}

# htpasswd as a MAIN request: nginx skips the access phase for auth_request
# subrequests, so auth_basic inside /_auth_htpasswd never ran and left
# /wd/hub open (2026-08-26). 401 WWW-Authenticate stays on this loopback
# response and is not forwarded to the browser.
server {
    listen 127.0.0.1:18081;
    server_name _;
    access_log off;
    location = /_auth_check {
        auth_basic "Selenoid";
        auth_basic_user_file /etc/nginx/selenoid.htpasswd;
        try_files /nonexistent-auth-ok =204;
    }
}

server {
    listen 443 ssl http2;
    server_name selenoid.qa.guru;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    # Selenium /se/file uploads (and similar) exceed nginx default 1m.
    # Seen on prod: client intended to send too large body ~1.2MB.
    client_max_body_size 50m;

    # Validate htpasswd without a browser Basic Auth challenge (auth_request
    # does not forward the loopback WWW-Authenticate header).
    location = /_auth_htpasswd {
        internal;
        proxy_pass http://127.0.0.1:18081/_auth_check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    # Публичный status (без auth) — ПЛОСКИЙ hub JSON {total,used,queued,pending,browsers},
    # как в оригинальном selenoid. Студенческие автотесты/примеры завязаны на этот контракт —
    # НЕ оборачивать в {state:{...}} (регрессия 648a34f, откачена). UI-shaped JSON — на /ui/status.
    location = /status {
        auth_basic off;
        proxy_pass http://selenoid_hub;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # UI-shaped status (без auth) — {state, origin, browsers, sessions, browserProtocols,
    # version}. Поллится фронтом selenoid-ui каждые 4s (fetch /ui/status).
    # .version здесь — stamp selenoid-ui, не hub. Версия hub: /hub/ping (public gitRevision).
    location = /ui/status {
        auth_basic off;
        proxy_pass http://selenoid_ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Back-compat alias: сырой hub /status (идентичен /status). Оставлен для мониторинга,
    # которое могло переехать сюда за время регрессии 648a34f.
    # Hub /ping — public gitRevision for release-smoke wait_for_prod_hub_version.
    location = /hub/ping {
        auth_basic off;
        proxy_pass http://selenoid_hub/ping;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /hub/status {
        auth_basic off;
        proxy_pass http://selenoid_hub/status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hub session logs API (WebSocket) — selenoid-ui не проксирует /logs/ (UI → /ws/logs/).
    location ^~ /logs/ {
        auth_request /_auth_htpasswd;

        proxy_pass http://selenoid_hub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hub /error — invalid session JSON (selenoid-ui не проксирует).
    location = /error {
        auth_request /_auth_htpasswd;

        proxy_pass http://selenoid_hub/error;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hub VNC WebSocket — selenoid-ui не проксирует /vnc/ (UI → /ws/vnc/).
    location ^~ /vnc/ {
        auth_request /_auth_htpasswd;

        proxy_pass http://selenoid_hub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebDriver API — htpasswd via auth_request (no native Basic Auth dialog).
    location ^~ /wd/hub {
        auth_request /_auth_htpasswd;

        proxy_pass http://selenoid_ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Playwright WS — query accessKey instead of Basic Auth.
    location ^~ /playwright/ {
        auth_basic off;
        if ($playwright_access_key_allowed = 0) {
            return 401;
        }

        proxy_pass http://selenoid_ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # UI, VNC, SSE, /video/, … — без basic auth (прокси на UI → hub).
    location / {
        auth_basic off;

        proxy_pass http://selenoid_ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# Прямой API hub с auth — для CI/тестов вне браузера (Playwright Authorization header)
server {
    listen 4445 ssl http2;
    server_name selenoid.qa.guru;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    client_max_body_size 50m;

    location / {
        auth_basic "Selenoid API";
        auth_basic_user_file /etc/nginx/selenoid.htpasswd;

        proxy_pass http://selenoid_hub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
